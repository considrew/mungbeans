name: Weekly Email Send (Manual)

# Scheduled Saturday sends run as the final job of build-deploy.yml after all
# weekly data updates and the Netlify deploy complete. Keep this workflow for
# manual one-off retries.

on:
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send weekly email
        run: |
          cd below-the-line
          python scripts/send_weekly_email.py
        env:
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZEPTOMAIL_API_TOKEN: ${{ secrets.ZEPTOMAIL_API_TOKEN }}
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
